zerops:
  - name: frontend
    setup: static
    # ==== How to build your application ====
    build:
      # what technologies should the build container be based on
      base: nodejs@20

      # which folder contains the source of this service
      source:
        path: frontend

      # what commands to use to build your app
      buildCommands:
        - npm i
        - npm run build

      # select which files / folders to deploy after the build
      # successfully finished; `~` marks the starting point of
      # the deploy path (the frontend folder)
      deployFiles:
        - dist/~

      # *optional*: which files / folders to cache for the next build run
      cache:
        - node_modules
        - package-lock.json

    # ==== How to run your application ====
    run:
      # all that is needed for SPA apps
      base: static